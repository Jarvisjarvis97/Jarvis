version: "3.8"
services:
orchestrator:
image: alpine:3.19
command: ["sh","-c","sleep infinity"]
restart: unless-stopped
environment:
• REDIS_URL=redis://redis:6379
• PG_HOST=postgres
• PGUSER=${PG_USER}
• PGPASSWORD=${PG_PASS}
• PGDATABASE=${PG_DB}
• QDRANT_URL=http://qdrant:6333
depends_on:
• redis
• postgres
• qdrant
healthcheck:
test: ["CMD-SHELL","echo ok"]
interval: 30s
timeout: 3s
retries: 3
start_period: 10s
